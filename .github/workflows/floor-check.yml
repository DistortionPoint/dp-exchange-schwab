name: Dependency floor check

on:
  schedule:
    # Weekly, Monday 09:00 UTC. Deliberately NOT push/pull_request — see
    # script/check_dependency_floor.sh's header for the full reasoning. In short: this
    # check freshly resolves every runtime dependency down to its declared floor,
    # including off-the-shelf transitive packages (req, finch, mint, ...) that this repo
    # does not pin and does not control. A red run can therefore be caused by an
    # unrelated package publishing a new release, not by anything changed here. A
    # per-push, blocking job with that failure mode is worse than the defect it catches —
    # it trains reviewers to ignore red, which this family has already relearned the cost
    # of once (see the publish-step hardening in ci.yml). Weekly is frequent enough that
    # a real regression does not sit undiscovered for long, and rare enough that noise
    # from an unrelated release does not become the background color of every PR.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Deliberately not a required check and never in ci.yml's `publish` job's `needs:` chain.
# A red run here must never block a merge or the release pipeline that runs on every
# merge to main — see the note above.
jobs:
  floor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28.0']
        elixir: ['1.18']
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - run: bash script/check_dependency_floor.sh
