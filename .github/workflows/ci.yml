name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Skip CI for bot version-bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        otp: ['28.0']
        elixir: ['1.18']
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Cache dependencies
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # Cache compiled build
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            build-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # Cache Dialyzer PLTs
      - name: Cache PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plts-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix dialyzer
      # `--warnings-as-errors` HERE as well as on `mix compile` above, and the two cover
      # different things: `mix compile` compiles `lib/` only, so a warning in a TEST file
      # never failed a build. That gap was found by running the dependency-floor checker and
      # reading what scrolled past — five warnings in this package's own test compilation
      # and two more in `dp_exchange_webull`'s, every one of them sitting there green.
      #
      # Two of the five were real (an optional callback called directly, so every package
      # not implementing it warned out of a shared macro) and three were the compiler
      # specialising a suite that is generic over the consuming package's fake. Both kinds
      # are now fixed rather than tolerated, because the argument for fixing them is not
      # tidiness: a handful of permanent warnings is exactly the noise a genuinely wrong one
      # hides behind, and this suite's whole job is to notice things.
      #
      # Applies to test files only — `mix compile --warnings-as-errors` above covers `lib/`.
      # Together they mean no warning survives anywhere in the build.
      - run: mix test --cover --warnings-as-errors

      - name: What the tarball actually contains
        # `mix.exs`'s `files:` comment ends "Nothing warns. Inspect `mix hex.build` before
        # every publish." That instruction is correct and nobody performs it, which makes it
        # the shape this family calls a mechanism built, documented and never reached.
        #
        # It is not hypothetical. `dp_exchange_core`'s own note records the day it failed: a
        # `files:` list written under `project/0` instead of `package/0` is **silently
        # ignored** — Hex ships its own defaults, and that put a 4.4 MB dialyzer PLT in the
        # tarball while the conformance suite and `usage-rules.md` were left out of it. The
        # build succeeded. The tests passed. Nothing warned, then or now.
        #
        # So the tarball is built and read here, on every push, rather than trusted. The
        # assertions are the things that are load-bearing for somebody who is not us:
        #
        #   * `usage-rules.md` — CLAUDE.md: "ships inside the Hex tarball and is what a
        #     consuming agent reads. It is not optional and it is not the README."
        #   * `CHANGELOG.md` — dp-exchange-coinbase issue #2: a consumer read a shipped
        #     changelog to decide whether an upgrade was safe. An absent one is not a
        #     cosmetic problem, it is the version-to-change mapping gone.
        #   * `lib/` — the package itself, which is what the PLT incident displaced.
        #   * `config/` absent — it governs this package's own dev and test, never a
        #     consumer's, and shipping it would let a consumer's build read it.
        #   * no PLT and no `.env` — build artefact and secrets. This repository is public
        #     and a tarball cannot be unpublished, only retired.
        run: |
          set -euo pipefail

          rm -f ./*.tar
          mix hex.build >/dev/null
          tarball=$(ls ./*.tar | head -1)

          mkdir -p _pkgcheck
          tar -xf "$tarball" -C _pkgcheck
          tar -tzf _pkgcheck/contents.tar.gz > _pkgcheck/files.txt

          fail=0
          require() {
            if ! grep -qE "$1" _pkgcheck/files.txt; then
              echo "MISSING from the tarball: $2"
              fail=1
            fi
          }
          refuse() {
            if grep -qE "$1" _pkgcheck/files.txt; then
              echo "SHIPPED and must not be: $2"
              grep -E "$1" _pkgcheck/files.txt | sed 's/^/    /'
              fail=1
            fi
          }

          require "^usage-rules\.md$"  "usage-rules.md — what a consuming agent reads"
          require "^CHANGELOG\.md$"    "CHANGELOG.md — the version-to-change mapping"
          require "^lib/"              "lib/ — the package itself"

          refuse "^config/"            "config/ — this package's own dev and test config"
          refuse "\.plt$"              "a dialyzer PLT — a build artefact"
          refuse "^\.env$|^\.env\."    "a .env file — secrets never ship"

          echo "Tarball contains $(grep -c '' _pkgcheck/files.txt) files."
          rm -rf _pkgcheck "$tarball"

          if [ "$fail" -ne 0 ]; then
            echo 'See this step'"'"'s comment: a misplaced files: list is silent, so this is'
            echo 'read from the built tarball rather than from mix.exs.'
            exit 1
          fi



  # No live-venue job in CI. Tier-1 tests (in-process fakes) are all CI runs;
  # tier-2 tests hit a venue's public API and run per venue, by hand, during
  # its extraction — never on a schedule, because a venue that sees a package
  # polling it on a timer will rate-limit or block (D7).

  publish:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.18'

      # Reuse deps cache from quality job
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-28.0-1.18-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - name: Auto-increment patch version
        # Increments from whichever is HIGHER: the version in mix.exs, or the newest
        # version actually published to Hex.
        #
        # Taking mix.exs alone can wedge this pipeline permanently, and did exactly that
        # to dp_exchange_core. Publishing happens BEFORE the version-bump commit below, so
        # a run that publishes and then fails on any later step leaves Hex ahead of git —
        # mix.exs never advances, every subsequent run recomputes the same already-published
        # version, and Hex refuses it ("can only modify a release up to one hour after
        # publication"). That is not self-correcting: it blocks every future release until
        # someone edits mix.exs by hand.
        #
        # Asking Hex what actually exists makes the step idempotent and self-healing: a
        # partial failure costs one version number, not the pipeline. If Hex is unreachable
        # the check degrades to mix.exs alone rather than blocking the release.
        run: |
          set -euo pipefail
          current=$(grep '@version "' mix.exs | sed 's/.*@version "\(.*\)"/\1/')

          published=$(curl -fsS --max-time 20 https://hex.pm/api/packages/dp_exchange_schwab \
            | grep -o '"version":"[0-9]\+\.[0-9]\+\.[0-9]\+"' \
            | sed 's/.*:"//; s/"//' \
            | sort -V | tail -1) || published=""

          if [ -n "$published" ]; then
            base=$(printf '%s\n%s\n' "$current" "$published" | sort -V | tail -1)
            echo "mix.exs=$current hex=$published -> incrementing from $base"
          else
            base="$current"
            echo "Hex unreachable; incrementing from mix.exs=$current"
          fi

          IFS='.' read -r major minor patch <<< "$base"
          new_version="$major.$minor.$((patch + 1))"
          sed -i "s/@version \"$current\"/@version \"$new_version\"/" mix.exs
          echo "VERSION=$new_version" >> "$GITHUB_ENV"

      - name: Cut a changelog heading for this version
        # dp-exchange-core issue #32: every entry in this repository's CHANGELOG sat under
        # `## [Unreleased]`, in the **published tarball**, so no consumer could tell which
        # version introduced a breaking change. This family signals a breaking change with a
        # minor bump, and those changes are repeatedly a refusal tuple or struct gaining a
        # field — invisible to the compiler and to a test that pins the old shape. The
        # consumer's own upgrade procedure is "read CHANGELOG.md for `### Changed —
        # BREAKING`, then grep for the old shape", and that needs version → change. Without
        # it, `### Changed — BREAKING` says *that* the shape changed, never whether they
        # already took it.
        #
        # **Before `mix hex.publish`, deliberately.** `CHANGELOG.md` ships inside the
        # tarball (see `mix.exs`'s `files:`), so a heading cut after the upload would
        # describe a tarball nobody can read.
        #
        # Idempotent, and by a guard rather than by hope: a first draft claimed the awk
        # "inserts under the FIRST `## [Unreleased]` and stops, so a re-run cannot stack two
        # headings", which was tested and is false — `[Unreleased]` survives the insert, so a
        # second pass cuts a second heading for the same version. The grep below is what
        # actually makes the claim true.
        #
        # An `[Unreleased]` with NOTHING under it gets no heading at all, and this is the
        # part that had to be corrected. It used to cut one anyway, on the reasoning that an
        # empty version section is "honest: that release recorded no changes". The reasoning
        # was fine and the consequence was not — that empty heading sits directly under
        # `## [Unreleased]`, which is the exact line any concurrent branch adds its own entry
        # to, so git's three-way merge has two plausible places to put that entry and no way
        # to know that only one of them means what the author intended. It picked wrong three
        # times: `dp_exchange_webull` twice and this repository once, where `## [0.2.5]` was
        # published empty while the change it shipped sat under `## [0.2.4]` — a version that
        # went to Hex before that change existed. Every occurrence had to be unpicked by
        # hand, and every one of them was a changelog claiming a version introduced something
        # it did not, which is precisely the defect issue #32 cut these headings to fix.
        #
        # That correction went one step too far, and dp-exchange-coinbase issue #2 is the
        # bill. It claimed "skipping the cut costs nothing real ... a version with no heading
        # is not a gap in the record". From inside the repository that is true — `git log` and
        # the Hex release list both still have it. From **inside the shipped tarball**, which
        # is the only thing a consumer reads, an absent heading is indistinguishable from a
        # heading this step dropped, and the reporter said exactly that: they took 0.3.26,
        # read `CHANGELOG.md`, found nothing above 0.3.25, and upgraded blind. Telling a
        # consumer nothing and telling them "nothing changed" are different messages, and only
        # one of them is information.
        #
        # So the heading is cut either way now, and an empty one carries an explicit marker
        # line saying so.
        #
        # **What makes that safe is the guard below, not optimism.** The merge hazard above is
        # real and cost three hand-unpicks; a marker line does not prevent a concurrent entry
        # landing under the wrong heading. What it does is make that landing SELF-EVIDENT — an
        # entry sitting under a heading whose body says "no consumer-facing changes" is a
        # contradiction on its face, where an entry under a silently empty heading looks
        # exactly like a normal release. The check below fails the build on precisely that
        # contradiction, which turns the incident from invisible into loud.
        run: |
          set -euo pipefail

          if grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Heading for $VERSION already present; nothing to cut."
            exit 0
          fi

          # Is there anything under `## [Unreleased]` at all? The first non-blank line after
          # it decides: another `## [` heading (or end of file) means the section is empty.
          unreleased_body=$(awk '
            /^## \[Unreleased\]$/ { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && NF { print; exit }
          ' CHANGELOG.md)

          # The guard the marker buys. A released section carrying the no-changes marker must
          # carry NOTHING else: if a concurrent branch's entry merged into one, that is the
          # misplacement this step's comment describes, and it is caught here instead of
          # shipping a changelog that credits the wrong version.
          # Matched on the SHAPE of a changelog entry — a `###` subsection or a list item —
          # not on "any content". The marker paragraph itself runs to several lines of prose,
          # and a first version of this guard flagged its own second line; a misplaced entry
          # always arrives as `### Fixed` or `- ...`, which prose never does.
          bad=$(awk '
            /^## \[/ { in_marked = 0; ver = $0 }
            /^_No consumer-facing changes/ { in_marked = 1; next }
            in_marked && /^(### |[-*] )/ { print ver; in_marked = 0 }
          ' CHANGELOG.md)

          if [ -n "$bad" ]; then
            echo "A version section marked 'no consumer-facing changes' has content under it:"
            echo "$bad"
            echo "An entry has almost certainly merged under the wrong heading — see this"
            echo "step's comment for the three times that happened before. Move it and re-run."
            exit 1
          fi

          today=$(date -u +%Y-%m-%d)

          # An empty `[Unreleased]` still gets a heading, with a body that says why it is
          # empty. See this step's comment: silence and "nothing changed" are different
          # messages to a consumer reading the tarball.
          if [ -z "$unreleased_body" ]; then
            marker="_No consumer-facing changes. Internal or packaging work only — recorded so"
            marker="$marker every published version has a heading, because an absent one cannot be"
            marker="$marker told apart from one the release pipeline dropped._"
          else
            marker=""
          fi

          awk -v v="$VERSION" -v d="$today" -v marker="$marker" '
            !cut && /^## \[Unreleased\]$/ {
              print
              print ""
              print "## [" v "] - " d
              if (marker != "") { print ""; print marker }
              cut = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.next

          mv CHANGELOG.next CHANGELOG.md
          echo "Cut heading for $VERSION."

      - name: Publish to Hex.pm
        # A failed `mix hex.publish` does NOT mean the release is absent from Hex.
        #
        # Observed 2026-09-06 on this repository: the upload reached 100%, then the command
        # exited non-zero with `Publishing failed / :timeout` — and `0.2.2` was on Hex all
        # along. The tarball had landed; only the response did not come back in time. The
        # job died there, so the version-bump commit below never ran, leaving Hex ahead of
        # git with no release commit and no tag, and the run red for a release that had
        # actually succeeded.
        #
        # Treating that as fatal is wrong twice over. It reports a failure that did not
        # happen, and a red run for a non-failure is precisely the alarm that trains
        # everyone to stop reading the alarms.
        #
        # So: ask Hex what exists rather than trusting the exit code. If this exact version
        # is published, the publish succeeded whatever the client said, and the run
        # continues to the version-bump commit that keeps git and Hex agreeing. If it is
        # genuinely absent, the step fails as before — an unreachable Hex still stops the
        # release rather than tagging one that never shipped.
        run: |
          set -uo pipefail
          if mix hex.publish --yes; then
            echo "Published $VERSION."
            exit 0
          fi

          echo "mix hex.publish exited non-zero; asking Hex whether $VERSION actually landed."

          published=$(curl -fsS --max-time 20 \
            "https://hex.pm/api/packages/dp_exchange_schwab" \
            | grep -oF "\"version\":\"$VERSION\"" | head -1) || published=""

          if [ -n "$published" ]; then
            echo "$VERSION IS on Hex — the upload landed and only the response was lost."
            exit 0
          fi

          echo "$VERSION is NOT on Hex. The publish genuinely failed."
          exit 1
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs CHANGELOG.md
          git commit -m "Release v${{ env.VERSION }} [skip ci]"
          git tag "v${{ env.VERSION }}"
          git push origin main --tags

      - name: Create GitHub release
        run: gh release create "v${{ env.VERSION }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
